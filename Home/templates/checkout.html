{% extends 'base.html' %}
{% block content %}

<p class="text-center fs-4 fw-bold mt-4">مرحباً بكم في صفحة الدفع</p>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4"
                 style="background-image: linear-gradient(90deg, #A100FFFF 0%, #71C4FFFF 100%);">
                <div class="card-header bg-primary text-white text-center rounded-top-4">
                    <h4 class="mb-0">إتمام الدفع</h4>
                </div>
                <div class="card-body p-4" style="background-color: rgba(255, 255, 255, 0.85); border-radius: 0 0 1rem 1rem;">
                    <form id="checkout-form" method="POST" action="{% url 'checkout' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="fullname" class="form-label">الاسم بالكامل</label>
                            <input type="text" class="form-control bg-light" id="fullname" name="fullname" required placeholder="الاسم الكامل">
                        </div>

                        <div class="mb-3">
                            <div class="row">
                                <div class="col">
                                    <label for="phone" class="form-label">رقم الهاتف</label>
                                    <input type="text" class="form-control bg-light" id="phone" name="phone" required placeholder="05XXXXXXXX">
                                </div>
                                <div class="col">
                                    <label for="email" class="form-label">البريد الإلكتروني</label>
                                    <input type="email" class="form-control bg-light" id="email" name="email" required placeholder="example@example.com">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="cardnumber" class="form-label">رقم البطاقة</label>
                            <input type="text" class="form-control bg-light" id="cardnumber" name="cardnumber" required placeholder="XXXX-XXXX-XXXX-XXXX">
                        </div>

                        <div class="mb-3">
                            <label for="cvv" class="form-label">CVV</label>
                            <input type="text" class="form-control bg-light" id="cvv" name="cvv" required placeholder="CVV">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">تاريخ الانتهاء</label>
                            <div class="row">
                                <div class="col">
                                    <input type="text" class="form-control bg-light" id="exp_month" name="exp_month" required placeholder="شهر">
                                </div>
                                <div class="col">
                                    <input type="text" class="form-control bg-light" id="exp_year" name="exp_year" required placeholder="سنة">
                                </div>
                            </div>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-success btn-lg mt-3 w-100 shadow-sm">تأكيد الدفع</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- SweetAlert Script -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.getElementById("checkout-form").addEventListener("submit", function (e) {
        e.preventDefault();

        Swal.fire({
            title: 'تم الدفع بنجاح!',
            text: 'شكرًا لتسوقك معنا ❤️',
            icon: 'success',
            confirmButtonText: 'العودة للصفحة الرئيسية'
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = "{% url 'showland' %}";
            }
        });
    });
</script>
{% endblock %}
