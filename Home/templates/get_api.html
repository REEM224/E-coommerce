{% extends 'base.html' %}
{% block content %}
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Image</th>
            <th>Title</th>
            <th>Description</th>
            <th>Price</th>
            
        </tr>
    </thead>
    <tbody>
        {% for item in api_data %}
        <tr>
            <td><img src="{{ item.image }}" alt="{{ item.title }}" style="width: 100px; height: auto;"></td>
            <td>{{ item.title }}</td>
            <td>{{ item.description }}</td>
            <td>{{ item.price }}</td>
        </tr>
        {% endfor %}
    </tbody>

{% endblock %}
